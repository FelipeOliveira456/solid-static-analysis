# Configuração do scorer SOLID (Etapa 4) — fonte única de thresholds.
# Empacotado no JAR como /analysis.properties. Ao correr o JAR, um ficheiro
# analysis.properties no diretório de trabalho (user.dir) faz merge por cima
# (só as chaves presentes substituem as do JAR).
#
# f(n) = n / (n + k) para projetos com < 10 classes (FIXED_THRESHOLD_RELAXED).
# k = 0 → f = 1 (sem escala numérica).
# No JSON de scoring, o campo "value" das métricas relaxadas é (métrica bruta × f) para
# comparar com os limiares NOMINAIS deste ficheiro; "rawMetric" repete o valor bruto quando difere.
scoring.relax.k=0

# LCOM (0–1)
threshold.lcom.medio=0.3
threshold.lcom.alto=0.6

# Clusters na projeção G4 (contagem)
threshold.projectionClusters.medio=2
threshold.projectionClusters.alto=3

# Proporção de métodos isolados G3 — a razão bruta é multiplicada por
# C(n,2) / (C(n,2) + k) (n = métodos da classe; k abaixo). Poucos métodos → poucos pares possíveis
# → peso menor; aumenta k para suavizar mais classes pequenas.
scoring.isolatedMethods.combinations.k=21

threshold.isolatedRatio.medio=0.4
threshold.isolatedRatio.alto=0.7

# Fan-out de switch G7 (número de cases)
threshold.switchCases.medio=4
threshold.switchCases.alto=5

# DISPATCH_AST_HEURISTICS (Open/Closed, AST):
# H1: homogeneidade H = 1 − d/n (d = discriminantes distintos em == / equals / Objects.equals;
#     n = nº de ifs na cadeia). Dispara se H > este valor (0 ≤ valor < 1).
scoring.dispatchAst.h1.homogeneityThreshold=0.25
# H2: (1) cadeia if/else if com pelo menos este nº de condições, ou (2) pelo menos este nº de if
#     consecutivos ao mesmo nível na lista de fluxo (não são else if uns dos outros).
scoring.dispatchAst.h2.minChainIfs=3
scoring.dispatchAst.h2.minConsecutiveTopIfs=3

# Profundidade de herança G2 (limites exclusivos: depth < medio → BAIXO, etc.)
threshold.inheritanceDepth.medio=2
threshold.inheritanceDepth.alto=3

# In-degree de superclasse concreta G2
threshold.concreteIndegree.medio=2
threshold.concreteIndegree.alto=4

# Número de interfaces implementadas G5 (classOutDegree)
threshold.implementsCount.medio=2
threshold.implementsCount.alto=4

# Instanciações diretas G1
threshold.instantiations.medio=2
threshold.instantiations.alto=3

# Out-degree normalizado G1
threshold.outDegreeNormalized.medio=0.3
threshold.outDegreeNormalized.alto=0.6

# Razão de dependências concretas G1
threshold.concreteDependencyRatio.medio=0.2
threshold.concreteDependencyRatio.alto=0.5

# Out-centrality G1 (limiares fixos, sem relax f(n))
threshold.g1OutCentrality.medio=0.5
threshold.g1OutCentrality.alto=0.85
